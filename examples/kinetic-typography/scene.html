<!doctype html><html><meta charset="utf-8"><title>Motion Studio Demo</title><style>body{margin:0;background:#141413;display:grid;place-items:center;height:100vh}canvas{width:min(100vw,1280px);height:auto}</style><canvas id="c" width="1280" height="720"></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),DURATION=8;window.DURATION=DURATION;const S=t=>{if(t<=0)return 0;const w=Math.sqrt(170),z=26/(2*w),wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))};function seek(t){g.fillStyle='#141413';g.fillRect(0,0,1280,720);g.textAlign='left';g.textBaseline='middle';const titles=['MOTION','DESIGN','STUDIO','86 STYLES'];const n=Math.min(3,Math.floor(t/2));const local=t%2,p=S(local-.12),x=110+(1-p)*960;g.fillStyle='#F1EFE5';g.font=n===3?'bold 110px Arial':'bold 160px Arial';g.fillText(titles[n],x,335);g.fillStyle='#D97757';g.fillRect(110,445,Math.max(0,960*p),18);g.fillStyle='#9EA1A4';g.font='26px monospace';g.fillText('DESIGN  /  CODE  /  SOUND',115,560)}window.seek=seek;seek(0);if(!navigator.webdriver){const start=performance.now();function tick(){seek((performance.now()-start)/1000%DURATION);requestAnimationFrame(tick)}tick()}</script></html>
