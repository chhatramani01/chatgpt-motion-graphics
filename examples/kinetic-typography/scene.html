<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion Studio Kinetic Demo</title><style>html,body{margin:0;height:100%;background:#141413;display:grid;place-items:center}canvas{width:min(100vw,1280px);height:auto}</style></head><body><canvas width="1280" height="720"></canvas><script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d');
const DURATION=8;window.DURATION=DURATION;
const spring=t=>{if(t<=0)return 0;const k=170,d=26,w=Math.sqrt(k),z=d/(2*w),wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))};
function renderAt(t){
 const W=canvas.width,H=canvas.height;g.setTransform(W/1280,0,0,H/720,0,0);
 g.fillStyle='#141413';g.fillRect(0,0,1280,720);g.textAlign='left';g.textBaseline='middle';
 const titles=['MOTION','DESIGN','STUDIO','86 STYLES'];
 const n=Math.min(3,Math.floor(Math.max(0,t)/2)),local=Math.max(0,t-n*2),p=spring(local-.1);
 g.font=n===3?'700 110px Arial':'700 160px Arial';
 g.fillStyle='#F1EFE5';g.fillText(titles[n],110+(1-p)*820,335);
 g.fillStyle='#D97757';g.fillRect(110,445,Math.max(0,960*p),18);
 g.fillStyle='#A9AAA9';g.font='26px monospace';g.fillText('DESIGN  /  CODE  /  SOUND',115,560);
}
window.renderAt=renderAt;window.seek=renderAt;renderAt(0);
if(!window.__MOTION_RENDER_MODE__){const start=performance.now();function preview(){renderAt(((performance.now()-start)/1000)%DURATION);requestAnimationFrame(preview)}requestAnimationFrame(preview)}
</script></body></html>
