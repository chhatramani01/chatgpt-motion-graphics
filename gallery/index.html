<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>86 Motion Graphics Styles — ChatGPT Motion Studio</title><style>body{font:16px system-ui;background:#101319;color:#f6f7fa;margin:0}header{padding:36px max(24px,calc((100vw - 1180px)/2));background:#181d28}h1{margin:0 0 12px}input{padding:14px;width:min(550px,85vw);border-radius:10px;border:1px solid #404958;background:#0e1116;color:white}main{max-width:1180px;margin:30px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}.card{background:#1b202b;border:1px solid #343b4a;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:16/10;object-fit:cover}.card article{padding:14px}.card h2{font-size:18px;margin:4px 0}.card p{color:#b9c3d5;font-size:13px}.card a{color:#95c2ff;margin-right:12px}</style></head><body><header><h1>Motion Graphics · 86 Style Atlas</h1><p>Browse visual references, then bring a style name into ChatGPT.</p><input id="q" placeholder="Search name, category, look…" aria-label="Search styles"></header><main id="grid"></main><script src="../assets/atlas/data.js"></script><script>const list=window.ATLAS_STYLES;const grid=document.getElementById('grid');function draw(){const q=document.getElementById('q').value.toLowerCase();grid.replaceChildren();for(const s of list.filter(s=>(s.name+' '+s.category+' '+s.description).toLowerCase().includes(q))){const d=document.createElement('section');d.className='card';const a=document.createElement('a');a.href=s.clip;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=s.poster;img.loading='lazy';img.alt=s.name;a.append(img);const art=document.createElement('article');const h=document.createElement('h2');h.textContent=s.number.toString().padStart(2,'0')+' · '+s.name;const p=document.createElement('p');p.textContent=s.category;const l=document.createElement('a');l.href=s.explainer;l.textContent='Explainer';l.target='_blank';l.rel='noopener noreferrer';const g=document.createElement('a');g.href='../styles/atlas/'+s.id+'/STYLE.md';g.textContent='Style guide';art.append(h,p,l,g);d.append(a,art);grid.append(d)}}document.getElementById('q').addEventListener('input',draw);draw();</script></body></html>
