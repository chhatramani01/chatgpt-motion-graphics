<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Studio — 86 styles</title><style>
:root{color-scheme:dark}body{margin:0;background:#10141c;color:#f2f4fa;font:16px system-ui}header{padding:28px max(20px,calc((100vw - 1100px)/2));background:#181e2a}h1{margin:0 0 10px;font-size:clamp(24px,4vw,42px)}p{color:#aab8cc}input{width:min(600px,88vw);padding:13px;background:#0e121a;color:white;border:1px solid #3a4657;border-radius:9px;font:inherit}main{max-width:1100px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{background:#1a2230;border:1px solid #354052;border-radius:13px;overflow:hidden}.card img{width:100%;aspect-ratio:16/10;object-fit:cover}.inside{padding:14px}h2{font-size:17px;margin:2px 0}small{color:#abb9ca}.links{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}a{color:#a7cdff}#status{padding:5px 0}
</style></head><body><header><h1>86 design styles</h1><p>Choose a visual style, then open its complete motion director prompt. Reference media remains externally hosted.</p><input id="query" placeholder="Search styles…" aria-label="Filter styles"><p id="status">Loading style catalog…</p></header><main id="results"></main><script type="module">
const box=document.querySelector('#results'),query=document.querySelector('#query'),status=document.querySelector('#status');
try{
 const res=await fetch('../assets/atlas/styles.json');if(!res.ok)throw Error('HTTP '+res.status);const styles=await res.json();
 function draw(){const search=query.value.toLowerCase();let count=0;box.replaceChildren();for(const s of styles){if(!(s.name+' '+s.category+' '+s.description).toLowerCase().includes(search))continue;count++;
 const card=document.createElement('article');card.className='card';
 const img=document.createElement('img');img.src=s.poster;img.loading='lazy';img.alt=s.name;
 const inner=document.createElement('div');inner.className='inside';
 const h=document.createElement('h2');h.textContent=String(s.number).padStart(2,'0')+' · '+s.name;
 const cat=document.createElement('small');cat.textContent=s.category;
 const links=document.createElement('div');links.className='links';
 for(const [title,href] of [['Full prompt','../styles/atlas/'+s.id+'/PROMPT.md'],['Motion clip',s.clip],['Explainer',s.explainer]]){const a=document.createElement('a');a.href=href;a.textContent=title;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}
 inner.append(h,cat,links);card.append(img,inner);box.append(card)}
 status.textContent=count+' / '+styles.length+' visual styles';}
 query.addEventListener('input',draw);draw();
}catch(e){status.textContent='Could not load styles.json. Serve the repository with a local HTTP server: python3 -m http.server 8000.';console.error(e)}
</script></body></html>
